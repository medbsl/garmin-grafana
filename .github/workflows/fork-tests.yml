name: Maintained fork tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build locked collector image
        run: docker build -t garmin-collector:test .
      - name: Test without network access or credentials
        run: docker run --rm --network none -v "$PWD/tests:/tests:ro" garmin-collector:test python -m unittest discover -s /tests -v
  kubernetes-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify pinned images, non-root startup and read-only storage
        run: |
          python3 -m venv "$RUNNER_TEMP/kubernetes-tests"
          "$RUNNER_TEMP/kubernetes-tests/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/kubernetes-tests/bin/python" tests/kubernetes_runtime.py
